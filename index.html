<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0F5C5B">
<meta name="description" content="YOURCLINIC — Better Health • Brighter Tomorrows. Premium specialist-led healthcare demo website.">
<meta property="og:title" content="YOURCLINIC — Better Health • Brighter Tomorrows">
<meta property="og:description" content="A premium modern healthcare clinic website concept.">
<title>YOURCLINIC — Better Health • Brighter Tomorrows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f8f5ef;--beige:#e8dccb;--teal:#0f5c5b;--teal2:#4f8f8b;--ink:#202827;--champ:#c9a96e;--white:#fffdf9;--line:rgba(15,92,91,.14);--shadow:0 24px 70px rgba(32,40,39,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Manrope,Arial,sans-serif}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}.serif{font-family:"Cormorant Garamond",Georgia,serif}.container{width:min(1180px,calc(100% - 40px));margin:auto}.nav{position:fixed;z-index:50;top:0;left:0;right:0;padding:18px 0;transition:.3s}.nav.scrolled{background:rgba(248,245,239,.82);backdrop-filter:blur(18px);box-shadow:0 1px 0 var(--line)}.navin{display:flex;align-items:center;justify-content:space-between;gap:24px}.logo{font-size:21px;font-weight:700;letter-spacing:.16em;color:var(--teal)}.links{display:flex;gap:25px;align-items:center;font-size:13px}.links a{opacity:.78}.links a:hover{opacity:1;color:var(--teal)}.btn{border:0;border-radius:999px;padding:13px 20px;background:var(--teal);color:white;cursor:pointer;transition:.25s;display:inline-flex;align-items:center;gap:8px}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,92,91,.22)}.btn.alt{background:transparent;color:var(--teal);border:1px solid var(--teal)}.menu{display:none;background:none;border:0;font-size:25px;color:var(--teal)}main{min-height:80vh}.hero{padding:150px 0 90px;min-height:690px;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:55px;background:radial-gradient(circle at 75% 35%,rgba(79,143,139,.18),transparent 34%),linear-gradient(135deg,#f8f5ef 0%,#eee2d1 100%)}.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:11px;color:var(--teal);font-weight:700;margin-bottom:18px}.hero h1{font-size:clamp(55px,7vw,94px);line-height:.86;margin:0 0 25px;font-weight:600;letter-spacing:-.03em}.hero p{max-width:590px;font-size:17px;line-height:1.8;color:#52605e}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.visual{height:510px;border-radius:38% 62% 54% 46%/43% 38% 62% 57%;background:radial-gradient(circle at 45% 25%,rgba(255,255,255,.9),transparent 28%),linear-gradient(145deg,rgba(15,92,91,.95),rgba(79,143,139,.78));box-shadow:var(--shadow);position:relative;overflow:hidden}.visual:before{content:"";position:absolute;width:270px;height:430px;left:50%;top:50%;transform:translate(-50%,-47%);border-radius:48% 52% 45% 55%;background:linear-gradient(145deg,rgba(255,255,255,.42),rgba(232,220,203,.08));filter:blur(1px);box-shadow:inset 0 0 40px rgba(255,255,255,.18)}.visual:after{content:"";position:absolute;inset:18%;border:1px solid rgba(255,255,255,.22);border-radius:50%;transform:rotate(22deg)}.trust{padding:25px 0;border-bottom:1px solid var(--line);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:#64716f;font-size:12px;text-transform:uppercase;letter-spacing:.12em}.section{padding:100px 0}.section.teal{background:var(--teal);color:white}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}.section h2{font-size:clamp(44px,5vw,68px);line-height:.95;margin:0 0 20px;font-weight:600}.lead{font-size:17px;line-height:1.8;color:#5d6866}.teal .lead{color:rgba(255,255,255,.75)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);margin-top:60px}.stat{background:var(--cream);padding:28px}.stat b{display:block;font-size:38px;color:var(--teal)}.stat span{font-size:12px;color:#697371}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:45px}.card{background:rgba(255,253,249,.72);border:1px solid var(--line);border-radius:24px;padding:28px;min-height:190px;transition:.25s}.card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}.card h3{font-family:"Cormorant Garamond",serif;font-size:30px;margin:10px 0}.card p{color:#68726f;line-height:1.65;font-size:14px}.num{font-size:11px;letter-spacing:.16em;color:var(--teal)}.photo{min-height:470px;border-radius:28px;background-size:cover;background-position:center;box-shadow:var(--shadow)}.aboutphoto{background-image:url('https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&w=1100&q=85')}.teamphoto{background-image:url('https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1100&q=85')}.techphoto{background-image:url('https://images.unsplash.com/photo-1579154204601-01588f351e67?auto=format&fit=crop&w=1100&q=85')}.pagehero{padding:155px 0 90px;background:linear-gradient(135deg,var(--beige),var(--cream))}.pagehero h1{font-size:clamp(52px,7vw,90px);line-height:.9;margin:0;max-width:900px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:35px 0}.filter{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--teal);cursor:pointer}.filter.active{background:var(--teal);color:white}.doctor{overflow:hidden;padding:0}.doctor .docimg{height:250px;background-size:cover;background-position:center}.doctor .body{padding:22px}.doc1{background-image:url('https://images.unsplash.com/photo-1551076805-e1869033e561?auto=format&fit=crop&w=700&q=80')}.doc2{background-image:url('https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?auto=format&fit=crop&w=700&q=80')}.doc3{background-image:url('https://images.unsplash.com/photo-1594824476967-48c8b964273f?auto=format&fit=crop&w=700&q=80')}.doc4{background-image:url('https://images.unsplash.com/photo-1532938911079-1b06ac7ceec7?auto=format&fit=crop&w=700&q=80')}.doc5{background-image:url('https://images.unsplash.com/photo-1651008376811-b90baee60c1f?auto=format&fit=crop&w=700&q=80')}.doc6{background-image:url('https://images.unsplash.com/photo-1599566150163-29194dcaad36?auto=format&fit=crop&w=700&q=80')}.techhero{background:linear-gradient(135deg,#082f2f,#0f5c5b 55%,#1c716e);color:white}.techhero .lead{color:rgba(255,255,255,.74)}.techorb{height:480px;border-radius:45%;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.35),transparent 20%),radial-gradient(circle at 35% 35%,rgba(201,169,110,.55),transparent 4%),radial-gradient(circle at 70% 65%,rgba(232,220,203,.3),transparent 4%),linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.03));box-shadow:inset 0 0 80px rgba(255,255,255,.1),0 30px 100px rgba(0,0,0,.18);position:relative}.techorb:after{content:"";position:absolute;inset:14%;border:1px solid rgba(255,255,255,.25);border-radius:50%;transform:rotate(-25deg)}.dashboard{background:#0b3e3e;border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:25px;box-shadow:var(--shadow);color:white}.bars{display:grid;grid-template-columns:repeat(7,1fr);align-items:end;height:150px;gap:10px;margin-top:25px}.bars i{display:block;background:linear-gradient(var(--champ),#8ab9b3);border-radius:8px 8px 2px 2px}.contactgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:30px}.form{background:white;border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:var(--shadow)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#64706e}.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:13px;outline:none}.field textarea{min-height:110px;resize:vertical}.info{padding:30px;background:var(--teal);color:white;border-radius:28px}.info p{color:rgba(255,255,255,.75);line-height:1.8}.map{height:220px;margin-top:25px;border-radius:20px;background:repeating-linear-gradient(45deg,#e5dccf 0 12px,#eee8df 12px 24px);display:grid;place-items:center;color:var(--teal);font-weight:700}.cta{padding:85px 0;background:var(--beige)}footer{padding:45px 0;background:#092f2f;color:white}.foot{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}.foot .logo{color:#d9c29a}.small{font-size:12px;color:rgba(255,255,255,.58)}.hidden{display:none!important}@media(max-width:850px){.links{display:none}.menu{display:block}.hero,.grid2,.contactgrid{grid-template-columns:1fr}.hero{padding-top:120px}.visual{height:390px}.cards{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.section{padding:75px 0}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(max-width:560px){.container{width:min(100% - 28px,1180px)}.cards{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.hero h1{font-size:58px}.pagehero{padding-top:125px}.photo{min-height:350px}.trust{display:grid;grid-template-columns:1fr 1fr}.btn{padding:12px 16px}}
</style>
</head>
<body>
<nav class="nav" id="nav"><div class="container navin"><a class="logo" href="#home">YOURCLINIC</a><div class="links"><a href="#home">Home</a><a href="#about">About</a><a href="#specialties">Specialties</a><a href="#doctors">Doctors</a><a href="#technology">Technology</a><a href="#contact">Contact</a><a class="btn" href="#contact">Book Appointment</a></div><button class="menu" onclick="toggleMenu()">☰</button></div></nav>
<div id="mobileMenu" class="hidden" style="position:fixed;z-index:49;inset:0;background:#f8f5ef;padding:100px 28px"><div style="display:grid;gap:24px;font-size:24px;font-family:Georgia,serif"><a href="#home" onclick="toggleMenu()">Home</a><a href="#about" onclick="toggleMenu()">About</a><a href="#specialties" onclick="toggleMenu()">Specialties</a><a href="#doctors" onclick="toggleMenu()">Doctors</a><a href="#technology" onclick="toggleMenu()">Technology</a><a href="#contact" onclick="toggleMenu()">Contact</a></div></div>
<main id="app"></main>
<script>
const specialties=[
["01","Cardiology","Heart & vascular care with a thoughtful, specialist-led approach."],
["02","Orthopaedics","Movement, joint and musculoskeletal care designed around everyday life."],
["03","Neurology","Specialist assessment and ongoing support for neurological concerns."],
["04","Gastroenterology","Modern digestive health care with clear, considered guidance."],
["05","Dermatology","Personalised skin health consultations and treatment planning."],
["06","Continued Care","Coordinated follow-up that keeps your health journey connected."]
];
const doctors=[
["Dr. Maya Mehra","Cardiology","doc1"],["Dr. Arjun Kapoor","Neurology","doc2"],["Dr. Rhea Malhotra","Dermatology","doc3"],["Dr. Kabir Anand","Orthopaedics","doc4"],["Dr. Tara Iyer","Gastroenterology","doc5"],["Dr. Neel Shah","Internal Medicine","doc6"]
];
function shell(content){return content+`<footer><div class="container foot"><div><div class="logo">YOURCLINIC</div><p class="small">Better Health • Brighter Tomorrows</p></div><div class="small">© 2026 YOURCLINIC — Demo website concept</div></div></footer>`}
function home(){return shell(`<section class="hero"><div class="container" style="display:contents"><div><div class="eyebrow">Specialist-led healthcare</div><h1 class="serif">Healthcare,<br>designed<br><em>around you.</em></h1><p>Thoughtful clinical expertise, modern technology and a calmer patient experience — brought together in one place.</p><div class="actions"><a class="btn" href="#contact">Book an appointment →</a><a class="btn alt" href="#specialties">Explore specialties</a></div></div><div class="visual"></div></div></section><div class="trust"><div>Specialist-led care</div><div>Modern diagnostics</div><div>Personalised attention</div><div>Patient-first experience</div></div><section class="section"><div class="container grid2"><div><div class="eyebrow">The YOURCLINIC approach</div><h2 class="serif">Medicine with more room for the human side.</h2><p class="lead">We bring specialist expertise and contemporary healthcare technology together with clear communication, thoughtful spaces and care that feels personal.</p><a class="btn" href="#about">Discover our philosophy</a></div><div class="photo aboutphoto"></div></div><div class="container stats"><div class="stat"><b>12+</b><span>Specialist disciplines</span></div><div class="stat"><b>30+</b><span>Experienced clinicians</span></div><div class="stat"><b>24/7</b><span>Care coordination</span></div><div class="stat"><b>1:1</b><span>Patient-first attention</span></div></div></section><section class="section" style="background:#efe5d7"><div class="container"><div class="eyebrow">Care, thoughtfully organised</div><h2 class="serif">Explore our specialties.</h2><div class="cards">${specialties.slice(0,3).map(s=>`<article class="card"><span class="num">${s[0]}</span><h3>${s[1]}</h3><p>${s[2]}</p><a style="color:var(--teal);font-size:13px" href="#specialties">Learn more →</a></article>`).join("")}</div></div></section><section class="section teal"><div class="container grid2"><div><div class="eyebrow" style="color:#c9a96e">Advanced, not intimidating</div><h2 class="serif">Technology that supports better decisions.</h2><p class="lead">From modern diagnostics to connected care workflows, our technology is designed to support clinicians and make the patient journey clearer.</p><a class="btn" style="background:#e8dccb;color:#0f5c5b" href="#technology">Explore technology</a></div><div class="dashboard"><div style="font-size:12px;opacity:.65">YOURCLINIC • CARE INTELLIGENCE</div><h3 class="serif" style="font-size:32px;margin:12px 0">Connected care dashboard</h3><div class="bars">${[55,80,48,92,68,75,58].map(h=>`<i style="height:${h}%"></i>`).join("")}</div></div></div></section><section class="cta"><div class="container" style="text-align:center"><div class="eyebrow">Start your care journey</div><h2 class="serif">Your health deserves time, clarity and attention.</h2><a class="btn" href="#contact">Book an appointment →</a></div></section>`)}
function about(){return shell(`<section class="pagehero"><div class="container"><div class="eyebrow">About YOURCLINIC</div><h1 class="serif">Our purpose is your <em>better health.</em></h1></div></section><section class="section"><div class="container grid2"><div class="photo aboutphoto"></div><div><div class="eyebrow">Our story</div><h2 class="serif">A more considered way to experience healthcare.</h2><p class="lead">YOURCLINIC is a fictional premium healthcare concept built around specialist expertise, modern diagnostics and a patient experience that feels calm, connected and human.</p><p class="lead">Every touchpoint is designed to make information easier to understand and care easier to navigate.</p></div></div></section><section class="section" style="background:#efe5d7"><div class="container"><div class="eyebrow">What guides us</div><h2 class="serif">Three principles.</h2><div class="cards"><article class="card"><span class="num">01</span><h3>Listen first.</h3><p>Care begins with understanding the person, not just the problem.</p></article><article class="card"><span class="num">02</span><h3>Explain clearly.</h3><p>We value conversations that make next steps easier to understand.</p></article><article class="card"><span class="num">03</span><h3>Stay connected.</h3><p>Thoughtful follow-up keeps every part of the care journey joined up.</p></article></div></div></section><section class="cta"><div class="container grid2"><div><div class="eyebrow">Why YOURCLINIC</div><h2 class="serif">Specialist expertise. Modern thinking. Human care.</h2></div><p class="lead">A fictional demo concept combining premium editorial design with a contemporary healthcare experience.</p></div></section>`)}
function specialtiesPage(){return shell(`<section class="pagehero"><div class="container"><div class="eyebrow">Specialties</div><h1 class="serif">Comprehensive care across every <em>specialty.</em></h1></div></section><section class="section"><div class="container"><div class="filters">${["All","Cardiology","Orthopaedics","Neurology","Gastroenterology","Dermatology"].map((x,i)=>`<button class="filter ${i===0?"active":""}" onclick="filterSpec(this,'${x}')">${x}</button>`).join("")}</div><div class="cards" id="specGrid">${specialties.map(s=>`<article class="card spec" data-cat="${s[1]}"><span class="num">${s[0]}</span><h3>${s[1]}</h3><p>${s[2]}</p><a style="color:var(--teal);font-size:13px" href="#contact">Book a consultation →</a></article>`).join("")}</div></div></section><section class="section teal"><div class="container grid2"><div><div class="eyebrow" style="color:#c9a96e">Featured specialty</div><h2 class="serif">Cardiology, with a complete view.</h2><p class="lead">A fictional specialty experience showing how specialist care, diagnostics and follow-up can be brought together.</p></div><div class="photo teamphoto"></div></div></section><section class="cta"><div class="container" style="text-align:center"><h2 class="serif">Not sure where to begin?</h2><p class="lead">Our care team can help guide you to the right specialty.</p><a class="btn" href="#contact">Talk to the care team</a></div></section>`)}
function doctorsPage(){return shell(`<section class="pagehero"><div class="container"><div class="eyebrow">Our doctors</div><h1 class="serif">Meet our <em>expert team.</em></h1><p class="lead" style="max-width:650px">Fictional clinician profiles for the YOURCLINIC website concept.</p></div></section><section class="section"><div class="container"><div class="filters"><button class="filter active" onclick="filterDocs(this,'All')">All</button><button class="filter" onclick="filterDocs(this,'Cardiology')">Cardiology</button><button class="filter" onclick="filterDocs(this,'Neurology')">Neurology</button><button class="filter" onclick="filterDocs(this,'Dermatology')">Dermatology</button><button class="filter" onclick="filterDocs(this,'Orthopaedics')">Orthopaedics</button></div><div class="cards" id="docGrid">${doctors.map(d=>`<article class="card doctor" data-cat="${d[1]}"><div class="docimg ${d[2]}"></div><div class="body"><span class="num">${d[1]}</span><h3>${d[0]}</h3><p>Specialist-led care with a patient-first approach.</p><a style="color:var(--teal);font-size:13px" href="#contact">View profile →</a></div></article>`).join("")}</div></div></section><section class="section" style="background:#efe5d7"><div class="container grid2"><div><div class="eyebrow">Patient-first care</div><h2 class="serif">The right specialist is only one part of the experience.</h2><p class="lead">From your first enquiry to follow-up, our fictional care model keeps communication and continuity at the centre.</p></div><div class="photo aboutphoto"></div></div></section>`)}
function technology(){return shell(`<section class="pagehero techhero"><div class="container grid2"><div><div class="eyebrow" style="color:#c9a96e">Technology</div><h1 class="serif">Advanced technology.<br><em>Better outcomes.</em></h1><p class="lead">A futuristic but human approach to healthcare technology — designed to support clinicians and simplify the patient journey.</p></div><div class="techorb"></div></div></section><section class="section"><div class="container"><div class="eyebrow">Our technology principles</div><h2 class="serif">Powerful behind the scenes.<br>Simple for patients.</h2><div class="cards"><article class="card"><span class="num">01</span><h3>Connected diagnostics</h3><p>Modern diagnostic workflows that help teams work from a clearer clinical picture.</p></article><article class="card"><span class="num">02</span><h3>Digital coordination</h3><p>Connected appointments, notes and follow-up designed around continuity.</p></article><article class="card"><span class="num">03</span><h3>Human-centred interfaces</h3><p>Technology should reduce friction, not add complexity.</p></article></div></div></section><section class="section teal"><div class="container grid2"><div class="dashboard"><div style="font-size:12px;opacity:.65">DEMO / NO REAL PATIENT DATA</div><h3 class="serif" style="font-size:34px">Care intelligence</h3><p class="lead">Illustrative dashboard interface for the website concept.</p><div class="bars">${[65,45,85,72,90,55,78].map(h=>`<i style="height:${h}%"></i>`).join("")}</div></div><div><div class="eyebrow" style="color:#c9a96e">Innovation</div><h2 class="serif">Technology should feel invisible when it works well.</h2><p class="lead">The experience stays warm and human while the infrastructure quietly helps the care team stay informed and connected.</p></div></div></section>`)}
function contact(){return shell(`<section class="pagehero"><div class="container"><div class="eyebrow">Contact & appointments</div><h1 class="serif">We’re here <em>for you.</em></h1><p class="lead" style="max-width:650px">Request an appointment or speak with our care team. This is a fictional demo form and does not submit real medical information.</p></div></section><section class="section"><div class="container contactgrid"><form class="form" onsubmit="event.preventDefault();alert('Demo only — your appointment request was not submitted.');"><div class="eyebrow">Book an appointment</div><h2 class="serif" style="font-size:48px">Tell us how we can help.</h2><div class="formgrid"><div class="field"><label>Full name</label><input required placeholder="Your name"></div><div class="field"><label>Phone</label><input required placeholder="+91 00000 00000"></div><div class="field"><label>Email</label><input type="email" placeholder="you@example.com"></div><div class="field"><label>Specialty</label><select><option>Select specialty</option>${specialties.map(s=>`<option>${s[1]}</option>`).join("")}</select></div><div class="field full"><label>Preferred date</label><input type="date"></div><div class="field full"><label>Message</label><textarea placeholder="Tell us briefly what you need help with."></textarea></div><div class="field full"><button class="btn" type="submit">Request appointment →</button></div></div></form><aside class="info"><div class="eyebrow" style="color:#c9a96e">YOURCLINIC</div><h2 class="serif" style="font-size:48px">Visit us.</h2><p>146, Wellness Avenue<br>New Delhi, India 110001</p><p>+91 11 4000 2026<br>hello@yourclinic.example</p><p>Mon–Sat · 9:00 AM–7:00 PM</p><div class="map">MAP PLACEHOLDER</div></aside></div></section><section class="cta"><div class="container" style="text-align:center"><div class="eyebrow">Frequently asked</div><h2 class="serif">Need a little more information?</h2><p class="lead">Speak with the fictional YOURCLINIC care team for guidance.</p><a class="btn" href="#contact">Contact the team</a></div></section>`)}
function render(){let p=location.hash.replace("#","")||"home";const pages={home,about,specialties:specialtiesPage,doctors:doctorsPage,technology,contact};document.getElementById("app").innerHTML=(pages[p]||home)();window.scrollTo(0,0);document.title="YOURCLINIC — "+(p.charAt(0).toUpperCase()+p.slice(1));}
function filterSpec(btn,cat){document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));btn.classList.add("active");document.querySelectorAll(".spec").forEach(x=>x.style.display=(cat==="All"||x.dataset.cat===cat)?"":"none")}
function filterDocs(btn,cat){document.querySelectorAll("#docGrid .filter").forEach(x=>x.classList.remove("active"));btn.classList.add("active");document.querySelectorAll(".doctor").forEach(x=>x.style.display=(cat==="All"||x.dataset.cat===cat)?"":"none")}
function toggleMenu(){document.getElementById("mobileMenu").classList.toggle("hidden")}
window.addEventListener("hashchange",render);window.addEventListener("scroll",()=>document.getElementById("nav").classList.toggle("scrolled",scrollY>30));render();
</script>
</body>
</html>
